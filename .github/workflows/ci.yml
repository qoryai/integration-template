name: CI

# The checks every Go integration runs, from qoryai/integrations: formatting, vet, tests,
# build, and the doc comments against revive.toml.

on:
  push:
    branches: [main, next]
  pull_request:

# A newer pull request run cancels the one before it; each push to main or next runs in a
# group of its own, so none is cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    # A pull request from this repository's next is checked by the push run on its commit.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref != 'next' ||
      github.event.pull_request.head.repo.full_name != github.repository
    uses: qoryai/integrations/.github/workflows/go.yml@e39423b387cf80ac3128afb7b13ec1c05ab34754
